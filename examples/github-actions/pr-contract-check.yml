name: OpenAPI PR guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Repository-relative entry paths; dependencies must be below each entry's directory.
      BASE_SPEC: api/openapi.yaml
      HEAD_SPEC: api/openapi.yaml
    steps:
      - name: Check out trusted comparison tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jigar48/api-contract-diff
          ref: 1a22cf40ec288ea089de8a1600b1faf94e284fb7
          path: contract-tool
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.0'
          package-manager-cache: false

      - name: Install and build trusted tool
        working-directory: contract-tool
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Check out PR base tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: contract-base
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Check out proposed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: contract-head
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Compare contracts
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { realpathSync, statSync } from 'node:fs';
          import { isAbsolute, join, relative, sep } from 'node:path';

          const { GITHUB_WORKSPACE, BASE_SPEC, HEAD_SPEC } = process.env;
          function entry(tree, filename) {
            const root = realpathSync(join(GITHUB_WORKSPACE, tree));
            const file = realpathSync(join(root, filename));
            const inside = relative(root, file);
            if (isAbsolute(inside) || inside === '..' || inside.startsWith('..' + sep) || !statSync(file).isFile()) {
              throw new Error('Entry is outside its checkout or is not a regular file');
            }
            return file;
          }

          let base, head;
          try {
            base = entry('contract-base', BASE_SPEC);
            head = entry('contract-head', HEAD_SPEC);
          } catch {
            console.error('Error: each specification entry must resolve to a regular file inside its own checkout');
            process.exit(2);
          }
          const cli = join(GITHUB_WORKSPACE, 'contract-tool', 'dist', 'cli.js');
          const result = spawnSync(process.execPath, [cli, 'compare', base, head, '--format', 'json'], { stdio: 'inherit' });
          if (result.status === null) console.error('Error: comparison process did not exit normally');
          process.exitCode = result.status ?? 2;
          JS
